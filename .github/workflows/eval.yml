name: Evaluate

# Evaluation-only CI. Nothing here builds a derivation and it needs no secrets,
# so it also runs on pull requests from forks.
#
# What it catches: flake outputs that stop evaluating. That is the common way a
# change breaks the tree without the author noticing, because it is easy to
# refactor the flake so x86_64 still evaluates and one arm64 target no longer
# does. The builds happen on Hydra (hydra.lab004.dev) and in browser.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake outputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The runner's own x86_64-linux. aarch64-linux is checked below. Darwin
      # build hosts are left out until they are a supported target: the flake
      # still names them, but parts of the tree (Mesa's clc tools) are Linux-only.
      - name: nix flake check
        run: nix flake check --no-build --show-trace

      # every aarch64-linux package down to its derivation, which flake check
      # does for x86_64-linux above
      - name: aarch64-linux packages evaluate
        run: |
          set -euo pipefail
          failed=0
          for p in $(nix eval --raw .#packages.aarch64-linux --apply 'ps: builtins.concatStringsSep " " (builtins.attrNames ps)'); do
            if ! nix eval --raw ".#packages.aarch64-linux.$p.drvPath" >/dev/null; then
              echo "::error::packages.aarch64-linux.$p does not evaluate"
              failed=1
            fi
          done
          exit $failed

      - name: Package sets evaluate on every system
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux; do
            count=$(nix eval --raw ".#packages.$system" \
              --apply 'ps: toString (builtins.length (builtins.attrNames ps))')
            echo "$system: $count packages"
            if [ "$count" -eq 0 ]; then
              echo "::error::$system exposes no packages"
              exit 1
            fi
          done

      # Every exposed attribute must actually be a derivation. flake check
      # covers this, but this reports every offender at once rather than
      # stopping at the first.
      - name: Every package is a derivation
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux; do
            bad=$(nix eval --raw ".#packages.$system" --apply \
              'ps: let bad = builtins.filter
                     (n: !(builtins.isAttrs ps.${n} && ps.${n} ? drvPath))
                     (builtins.attrNames ps);
                   in builtins.concatStringsSep " " bad')
            if [ -n "$bad" ]; then
              echo "::error::$system exposes non-derivation attributes: $bad"
              exit 1
            fi
            echo "$system: all attributes are derivations"
          done

      # The targets a release depends on. Named explicitly so that losing one
      # is a hard failure rather than a package that quietly stops existing.
      - name: Release targets evaluate
        run: |
          set -euo pipefail
          targets="
            image image-minimal image-wayland image-wayland-minimal image-hfs image-apfs image-debug
            image-installer image-nvidia
            image-arm64-virt image-arm64-virt-minimal image-arm64-virt-wayland
            image-arm64-bcm2837 image-arm64-t8103 ramdisk-arm64-t8010
          "
          failed=0
          for target in $targets; do
            if nix eval --raw ".#$target.drvPath" >/dev/null 2>&1; then
              echo "ok    $target"
            else
              echo "::error::$target does not evaluate"
              failed=1
            fi
          done
          exit $failed

      # the jobs Hydra builds: every release image and check must evaluate
      - name: Hydra jobs evaluate
        run: |
          set -euo pipefail
          for job in $(nix eval --raw .#hydraJobs --apply 'j: builtins.concatStringsSep " " (builtins.concatLists (map (g: map (n: g + "." + n) (builtins.attrNames j.${g})) (builtins.attrNames j)))'); do
            nix eval --raw ".#hydraJobs.$job.drvPath" >/dev/null
            echo "ok    $job"
          done

      - name: Runners evaluate
        run: |
          set -euo pipefail
          for app in default vm kvm arm64-virt arm64-uefi arm64-uboot; do
            nix eval --raw ".#apps.x86_64-linux.$app.program" >/dev/null
            echo "ok    $app"
          done

name: Build full image

on:
#  Don't enable due to workflow limits & schedule can only run on the default branch
#  pull_request:
#    branches: [upstream-xnu-12377]
#  push:
#    branches: [upstream-xnu-12377]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-minimal:
    name: Build image-full
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://hydra.lab004.dev
            extra-trusted-public-keys = hydra.lab004.dev-1:gPXVaEarmWgIFDuqmpf+9gXetBCC9jxzkZg+CZ8cC+M=

      # the release file, named puredarwin-<target>-<version>.<date>.<time>.<commit>-<arch>.img.zst
      # (nix/release.nix). Hydra builds these on every push to main, this job is for a build by hand
      - name: Build the minimal release image
        run: nix build -L .#hydraJobs.release.full

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: puredarwin-full
          path: result/puredarwin-*
          if-no-files-found: error

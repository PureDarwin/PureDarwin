name: Build all images

# Full multi-target image build. Complements eval.yml (evaluation-only):
# this one actually builds. Everything needed comes from the flake itself
# (the Apple SDK is built from in-tree XNU headers, see
# nix/pkgs/toolchain/apple-sdk-pinned.nix), so no secrets are required and
# this also runs on pull requests from forks if the triggers are enabled.
#
# The matrix covers every image target exposed by packages.<system>:
#   core   24 x86_64 base images (minimal/desktop/installer/legacy/tests/...)
#   gpu    14 x86_64 GPU images (amdgpu/radeon/i915/nouveau families)
#   cross   9 cross-built images (arm64 virt/t8010/rpi3-class/riscv64)
#   extras  3 non-.img image-like targets (netboot tree, WSL bundles)
#   all    the union
#
# Cost warning: `all` is ~50 full image builds. Ubuntu runners build one
# image each, in parallel, and upload it as an Actions artifact
# (puredarwin-<target>). Use the `targets` input to rebuild a subset:
#   targets: image-minimal,image-arm64-virt-minimal
#
# Triggers are dispatch-only for the same reason as build.yml (workflow
# limits; schedules can only run on the default branch):
#  pull_request:
#    branches: [upstream-xnu-12377]
#  push:
#    branches: [upstream-xnu-12377]
on:
  workflow_dispatch:
    inputs:
      preset:
        description: Which set of image targets to build
        type: choice
        default: core
        options:
          - core
          - gpu
          - cross
          - all
      targets:
        description: Explicit comma/space-separated targets (overrides preset)
        required: false
        default: ''

concurrency:
  group: build-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      PRESET: ${{ inputs.preset }}
      TARGETS: ${{ inputs.targets }}
    steps:
      - name: Compute target list
        id: plan
        run: |
          set -euo pipefail
          if [ -n "$TARGETS" ]; then
            # Explicit list: normalise separators, drop empties, allow only
            # [A-Za-z0-9._-] so nothing unsanitary can reach the build job.
            targets=$(printf '%s\n' "$TARGETS" | tr ', ' '\n\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | sort -u)
            invalid=$(printf '%s\n' "$targets" | grep -vE '^[A-Za-z0-9._-]+$' || true)
            if [ -n "$invalid" ]; then
              echo "::error::Invalid target name(s): $invalid"
              exit 1
            fi
            json=$(printf '%s\n' "$targets" | jq -R . | jq -sc .)
          else
            case "$PRESET" in
              core)
                json='[
                  "image-minimal","image-minimal-debug","image","image-debug",
                  "image-stripped","image-hfs","image-apfs","image-apfs-minimal",
                  "image-wayland","image-wayland-minimal","image-installer",
                  "iso-installer","image-shell","image-legacy","image-legacy-minimal",
                  "image-legacy-shell","image-ia32","image-ia32-minimal",
                  "image-ia32-dual","image-multiboot-minimal","image-grub-linux-minimal",
                  "image-tools-test","image-frameworks-test","image-cg-test"
                ]' ;;
              gpu)
                json='[
                  "image-amdgpu","image-amdgpu-test","image-amdgpu-debug",
                  "image-amdgpu-mesa","image-amdgpu-argon-gles","image-amdgpu-argon-cpu",
                  "image-amdgpu-720","image-amdgpu-switch","image-amdgpu-allfw",
                  "image-radeon","image-i915","image-i915-legacy",
                  "image-gpu","image-gpu-legacy"
                ]' ;;
              cross)
                json='[
                  "image-arm64-virt","image-arm64-virt-debug",
                  "image-arm64-virt-minimal","image-arm64-virt-minimal-release",
                  "image-arm64-virt-wayland","image-arm64-virt-wayland-debug",
                  "image-arm64-bcm2837","image-arm64-sg2002",
                  "image-riscv64-virt-minimal"
                ]' ;;
              all)
                # extras: netboot tree + WSL bundles (no .img, still image-like)
                json='[
                  "image-minimal","image-minimal-debug","image","image-debug",
                  "image-stripped","image-hfs","image-apfs","image-apfs-minimal",
                  "image-wayland","image-wayland-minimal","image-installer",
                  "iso-installer","image-shell","image-legacy","image-legacy-minimal",
                  "image-legacy-shell","image-ia32","image-ia32-minimal",
                  "image-ia32-dual","image-multiboot-minimal","image-grub-linux-minimal",
                  "image-tools-test","image-frameworks-test","image-cg-test",
                  "image-amdgpu","image-amdgpu-test","image-amdgpu-debug",
                  "image-amdgpu-mesa","image-amdgpu-argon-gles","image-amdgpu-argon-cpu",
                  "image-amdgpu-720","image-amdgpu-switch","image-amdgpu-allfw",
                  "image-radeon","image-i915","image-i915-legacy",
                  "image-gpu","image-gpu-legacy",
                  "image-arm64-virt","image-arm64-virt-debug",
                  "image-arm64-virt-minimal","image-arm64-virt-minimal-release",
                  "image-arm64-virt-wayland","image-arm64-virt-wayland-debug",
                  "image-arm64-bcm2837","image-arm64-sg2002",
                  "image-riscv64-virt-minimal",
                  "netboot-arm64-virt-minimal","wsl","wsl-debug"
                ]' ;;
              *)
                echo "::error::Unknown preset '$PRESET'"
                exit 1 ;;
            esac
          fi
          # Normalise to one flat JSON array. `flatten` is a no-op on the flat
          # preset/explicit lists and collapses accidental nesting. This guards
          # against the double-wrap failure mode: running `jq -sc .` on text
          # that is already a JSON array wraps it as [["image-minimal",...]];
          # GitHub then expands the outer single-element array into ONE build
          # job whose matrix.target is the whole inner array, which the run
          # template renders as the literal word "Array" -> nix looks up
          # ".#Array" and dies with "does not provide attribute
          # 'packages.x86_64-linux.Array' ...".
          json=$(printf '%s' "$json" | jq -c 'flatten | unique')
          count=$(printf '%s' "$json" | jq length)
          if [ "$count" -eq 0 ]; then
            echo "::error::Target list resolved to zero targets"
            exit 1
          fi
          {
            echo "### Plan"
            echo ""
            echo "Preset \`${PRESET:-(custom targets)}\` — $count target(s):"
            printf '%s\n' "$json" | jq -r '.[] | "- \(.)"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "matrix={\"target\": $json}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The runner image ships ~25 GB of preinstalled SDKs we do not need;
      # image closures (Wayland/XFCE ones especially) are large, so reclaim
      # the space before Nix starts writing to /nix.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm /opt/microsoft /opt/google \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            # Let single-derivation builds (kernel, LLVM) use all runner cores.
            cores = 0

      # Optional: push built paths to a Cachix cache so reruns and dependent
      # jobs skip everything already built. Requires secrets CACHIX_BINARY_CACHE
      # and CACHIX_AUTH_TOKEN; uncomment the step to activate (it no-ops while
      # the secret is unset).
      # - name: Push to Cachix
      #   if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
      #   uses: cachix/cachix-action@v16
      #   with:
      #     name: ${{ secrets.CACHIX_BINARY_CACHE }}
      #     authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Belt and braces: the plan step emits scalar names only, but if a
          # non-scalar ever slipped into the matrix, GitHub would render it as
          # the literal word "Array"/"Object" here and nix would fail hunting
          # for a package with that name. Fail with the real explanation.
          case "$TARGET" in
            [A-Za-z0-9._-]*) ;;
            *)
              echo "::error::matrix.target must be a single target name, got: $TARGET"
              exit 1 ;;
          esac
          nix build -L ".#$TARGET" --out-link result

      - name: Collect outputs
        run: |
          set -euo pipefail
          # -L: dereference the result symlink; some targets ship kernel,
          # boot-args and ramdisk next to the image, or no .img at all
          # (netboot tree, WSL bundle), so upload everything result/ holds.
          mkdir -p "artifacts/${{ matrix.target }}"
          cp -rL result/. "artifacts/${{ matrix.target }}/"
          du -sh "artifacts/${{ matrix.target }}"

      - name: Job summary
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            ls -lh "artifacts/${{ matrix.target }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puredarwin-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          retention-days: 14
          if-no-files-found: error
